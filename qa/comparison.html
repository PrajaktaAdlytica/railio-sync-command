<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Railixa design QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #101820; color: #f8fafc; font: 600 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
      figure { min-width: 0; margin: 0; overflow: hidden; border: 1px solid #344252; border-radius: 12px; background: #1a2530; }
      figcaption { padding: 10px 12px; border-bottom: 1px solid #344252; letter-spacing: 0.04em; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Reference · current website</figcaption>
        <img src="../references/railixa-current-home.png" alt="Reference website screenshot" />
      </figure>
      <figure>
        <figcaption>Implementation · Railixa premium update</figcaption>
        <img src="./implementation-home-1280x720.png" alt="Updated Railixa website screenshot" />
      </figure>
    </main>
  </body>
</html>
